name: False positive / false negative report
description: The tool flagged something it should not have, or missed something it should catch.
title: "[detection]: "
labels: ["detection"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What happened?
      options:
        - The tool flagged or removed a character it should keep (false positive)
        - The tool missed a character it should catch (false negative)
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample text
      description: The smallest sample that reproduces the problem. If you know the codepoint, mention it as U+XXXX.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where did the text come from?
      placeholder: e.g. ChatGPT response pasted into VS Code
