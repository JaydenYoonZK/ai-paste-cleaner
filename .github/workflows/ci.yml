name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: node --check docs/cleaner.js && node --check docs/app.js && node --check scripts/export-rules.mjs && node --check bin/cli.mjs

      - name: The CLI scans this repository's own documentation
        run: node bin/cli.mjs README.md CHANGELOG.md CONTRIBUTING.md

      - name: Regenerate ruleset
        run: npm run export-rules

      - name: Check generated files
        run: git diff --exit-code docs/data/rules.json
